[package]
authors = ["OverHash <46231745+OverHash@users.noreply.github.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
name = "supermarket-tracker"
publish = false
repository = "https://github.com/OverHash/supermarket-tracker"
version = "0.1.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "supermarket-tracker"
path = "src/main.rs"

[dependencies]
dotenvy = "0.15.7"
error-stack = "0.8.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = [
	"gzip",
	"json",
	"rustls",
	"cookies",
	"query",
] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", default-features = false, features = [
	"postgres",
	"runtime-tokio",
	"tls-rustls-aws-lc-rs",
	"macros",
	"migrate",
] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
	"fmt",
	"env-filter",
] }

[lints.clippy]
cargo = "deny"
pedantic = "deny"

multiple_crate_versions = { level = "allow", priority = 1 }

# Config for dist (cargo-dist)
[package.metadata.dist]
dist = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
