[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = []
auto-includes = false
unix-archive = ".tar.gz"
source-tarball = false
checksum = "false"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
	"aarch64-apple-darwin",
	"aarch64-unknown-linux-gnu",
	"aarch64-pc-windows-msvc",
	"x86_64-apple-darwin",
	"x86_64-unknown-linux-gnu",
	"x86_64-unknown-linux-musl",
	"x86_64-pc-windows-msvc",
]

# custom config
github-attestations = true
dispatch-releases = true
pr-run-mode = "skip"
github-build-setup = "../build-setup.yml"

# Keep action versions consistent with the other GitHub workflows.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2

# we only care for ubuntu 26
[dist.github-custom-runners.global]
runner = "ubuntu-26.04"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-26.04"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-26.04-arm"
host = "aarch64-unknown-linux-gnu"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "ubuntu-26.04"
host = "x86_64-unknown-linux-gnu"

[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-26"
host = "aarch64-apple-darwin"

[dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-26-intel"
host = "x86_64-apple-darwin"

[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "ubuntu-26.04"
host = "x86_64-unknown-linux-gnu"
container = { image = "messense/cargo-xwin:0.23.1@sha256:9856b895265d4966f212228ba64802cf89337e2a2a537aa2533c1b8784cbc81b", host = "x86_64-unknown-linux-musl", package-manager = "apt" }
